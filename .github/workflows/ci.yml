name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check browser scripts
        run: for f in js/*.js; do node --check "$f"; done
      - name: Run planner checks
        run: node demo/check.js
